# Extra server used by the compatibility test. Mounted into both images.
# Port 80 (the image's default.conf) is left untouched.
server {
    listen 8080;
    listen 8443 ssl;
    server_name localhost;

    ssl_certificate     /etc/nginx/tls/cert.pem;
    ssl_certificate_key /etc/nginx/tls/key.pem;

    root /srv/compat;                # test/compat/html + generated big.bin
    client_max_body_size 1m;         # POST over 1 MB -> 413

    gzip on;
    gzip_types text/plain text/css application/json;
    gzip_min_length 20;

    # echo back parts of the request
    location = /echo {
        return 200 "method=$request_method uri=$request_uri args=$args\n";
    }

    # add_header, including on the response nginx generates itself
    location = /headers {
        add_header X-Compat "yes" always;
        add_header Cache-Control "no-store";
        return 200 "ok\n";
    }

    # rewrite to another location
    location /old/ {
        rewrite ^/old/(.*)$ /echo?from=$1 last;
    }

    # regex location with a capture
    location ~ ^/item/(\d+)$ {
        return 200 "item $1\n";
    }

    # SPA-style fallback
    location /spa/ {
        try_files $uri /hello.txt;
    }

    # CVE-2026-15176 (expected difference): stock computes a path from a
    # wrapped-around length, the fixed build refuses the mapping
    location /foo/ {
        alias /bar/;
        rewrite ^/foo/.*$ /x;
        return 200 "$request_filename\n";
    }
}
